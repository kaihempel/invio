---
# Database and database user (research R10). Never drops anything (G8).
# Every task that touches the database password uses no_log (FR-017).
# A server on localhost (managed by this role or by another tool) is administered over the root
# socket; only a remote host needs invio_db_admin_user/_password (validated first).
- name: Check that the external MariaDB server is reachable
  ansible.builtin.wait_for:
    host: "{{ invio_db_host }}"
    port: "{{ invio_db_port }}"
    timeout: 10
    msg: "MariaDB server {{ invio_db_host }}:{{ invio_db_port }} is not reachable"
  when: not invio_mariadb_manage_server and invio_db_host != 'localhost'

- name: Check that the local MariaDB server that is managed elsewhere is running
  ansible.builtin.wait_for:
    path: /run/mysqld/mysqld.sock
    timeout: 10
    msg: "MariaDB server socket /run/mysqld/mysqld.sock does not exist"
  when: not invio_mariadb_manage_server and invio_db_host == 'localhost'

- name: Install the MariaDB server and the Python driver for the Ansible modules
  ansible.builtin.apt:
    name: "{{ ['mariadb-server', 'python3-pymysql'] if invio_mariadb_manage_server else ['python3-pymysql'] }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Start and enable the MariaDB server
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true
  when: invio_mariadb_manage_server

- name: Create the database
  ansible.mysql.mysql_db:
    <<: &invio_db_login
      login_unix_socket: "{{ '/run/mysqld/mysqld.sock' if invio_db_host == 'localhost' else omit }}"
      login_host: "{{ omit if invio_db_host == 'localhost' else invio_db_host }}"
      login_port: "{{ omit if invio_db_host == 'localhost' else invio_db_port }}"
      login_user: "{{ omit if invio_db_host == 'localhost' else invio_db_admin_user }}"
      login_password: "{{ omit if invio_db_host == 'localhost' else invio_db_admin_password }}"
    name: "{{ invio_db_name }}"
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    state: present
  no_log: true

- name: Create the database user (the password is only updated when it differs)
  ansible.mysql.mysql_user:
    name: "{{ invio_db_user }}"
    host: "{{ invio_db_user_host }}"
    password: "{{ invio_db_password }}"
    priv: "{{ invio_db_name }}.*:ALL"
    update_password: always
    state: present
    <<: *invio_db_login
  no_log: true
