---
# Not meant to be overridden: these mirror deploy/systemd/.
invio_units:
  - invio-run-due.service
  - invio-run-due.timer
  - invio-notify-retry.service
  - invio-notify-retry.timer
invio_timers:
  - invio-run-due.timer
  - invio-notify-retry.timer
invio_services:
  - invio-run-due.service
  - invio-notify-retry.service
# Unit states that mean "still running" (a oneshot unit is activating while it runs).
invio_busy_states:
  - active
  - activating
  - deactivating
  - reloading
invio_llm_providers:
  - mistral
  - openai
  - anthropic
  - google
# Memory ceilings: a drop-in is written only when the value differs from the shipped default.
invio_memory_overrides:
  - unit: invio-run-due.service
    value: "{{ invio_run_due_memory_max }}"
    default: 1G
  - unit: invio-notify-retry.service
    value: "{{ invio_notify_retry_memory_max }}"
    default: 256M
# Keys the template writes itself (plus INVIO_ENV_FILE, which must never be set on a server):
# invio_env_extra may not repeat them. tests/test_deploy_role.py keeps this list in step with
# templates/invio.env.j2.
invio_managed_env_keys:
  - INVIO_DATABASE_URL
  - INVIO_SMTP_HOST
  - INVIO_SMTP_PORT
  - INVIO_SMTP_SECURITY
  - INVIO_SMTP_FROM
  - INVIO_SMTP_USER
  - INVIO_SMTP_PASSWORD
  - INVIO_MISTRAL_API_KEY
  - INVIO_OPENAI_API_KEY
  - INVIO_ANTHROPIC_API_KEY
  - INVIO_GOOGLE_API_KEY
  - INVIO_LOG_LEVEL
  - INVIO_HTTP_CONTACT
  - INVIO_ARCHIVE_DIR
  - INVIO_HEALTHCHECK_URL
  - INVIO_ENV_FILE
