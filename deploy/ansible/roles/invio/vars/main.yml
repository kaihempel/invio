---
# Not meant to be overridden: these mirror deploy/systemd/.
invio_units:
  - invio-run-due.service
  - invio-run-due.timer
  - invio-notify-retry.service
  - invio-notify-retry.timer
invio_timers:
  - invio-run-due.timer
  - invio-notify-retry.timer
invio_services:
  - invio-run-due.service
  - invio-notify-retry.service
# Unit states that mean "still running" (a oneshot unit is activating while it runs).
invio_busy_states:
  - active
  - activating
  - deactivating
  - reloading
invio_llm_providers:
  - mistral
  - openai
  - anthropic
  - google
# Memory ceilings: a drop-in is written only when the value differs from the shipped default.
invio_memory_overrides:
  - unit: invio-run-due.service
    value: "{{ invio_run_due_memory_max }}"
    default: 1G
  - unit: invio-notify-retry.service
    value: "{{ invio_notify_retry_memory_max }}"
    default: 256M
