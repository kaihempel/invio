---
- name: Prepare
  hosts: all
  become: true
  tasks:
    # The role clones from a copy of the mounted repository that lives on the container's own
    # file system. Docker Desktop (macOS) fails object reads of the checkout tool on a read-only
    # bind mount with "Permission denied"; a plain file copy (clone --no-hardlinks) is not affected, and
    # the copy keeps the test independent of file ownership on the mount.
    - name: Install the version control tool to copy the repository under test
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Copy the repository under test from the read-only mount
      ansible.builtin.command:
        argv: [git, clone, --no-hardlinks, --no-checkout, /src, /srv/invio-src]
        creates: /srv/invio-src

    - name: Run the role with an empty database password
      block:
        - name: Include the role
          ansible.builtin.include_role:
            name: invio
          vars:
            invio_db_password: ""
        - name: Remember that the role did not fail
          ansible.builtin.set_fact:
            invio_negative_failed: false
      rescue:
        - name: Remember that the role failed
          ansible.builtin.set_fact:
            invio_negative_failed: true
            invio_negative_msg: "{{ ansible_failed_result | to_json }}"

    - name: Check that the failure names the variable and that nothing was changed
      ansible.builtin.stat:
        path: /etc/invio
      register: invio_negative_dir

    - name: Assert the negative case
      ansible.builtin.assert:
        that:
          - invio_negative_failed
          - "'invio_db_password' in invio_negative_msg"
          - not invio_negative_dir.stat.exists
        quiet: true
