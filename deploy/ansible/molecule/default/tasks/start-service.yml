---
# Starts invio_service, waits for it (oneshot) and requires Result=success.
- name: Start the service
  ansible.builtin.command:
    argv: [systemctl, start, "{{ invio_service }}"]
  changed_when: true

- name: Check the result of the service
  ansible.builtin.command:
    argv: [systemctl, show, -p, Result, --value, "{{ invio_service }}"]
  register: invio_service_result
  changed_when: false
  failed_when: invio_service_result.stdout != 'success'
