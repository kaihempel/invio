---
- name: Verify
  hosts: all
  become: true
  vars:
    # Secrets that must never appear in the journal (newline-separated for the checker).
    invio_verify_secrets: "{{ [invio_db_password, invio_llm_api_keys.mistral] | join('\n') }}"
    invio_verify_systemd_run:
      - systemd-run
      - --wait
      - --pipe
      - --collect
      - --uid=invio
      - --gid=invio
      - -p
      - EnvironmentFile=/etc/invio/invio.env
      - -p
      - WorkingDirectory=/var/lib/invio
      - -p
      - StateDirectory=invio
      - -E
      - PYTHONDONTWRITEBYTECODE=1
      - -E
      - HOME=/var/lib/invio
  tasks:
    - name: Check that the timers are enabled
      ansible.builtin.command:
        argv: [systemctl, is-enabled, "{{ item }}"]
      loop:
        - invio-run-due.timer
        - invio-notify-retry.timer
      register: invio_enabled
      changed_when: false
      failed_when: invio_enabled.stdout != 'enabled'

    - name: Check that the timers are active
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}"]
      loop:
        - invio-run-due.timer
        - invio-notify-retry.timer
      register: invio_active
      changed_when: false
      failed_when: invio_active.stdout != 'active'

    - name: Stat the env file and its directory
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/invio/invio.env
        - /etc/invio
      register: invio_stat

    - name: Check the owners and modes
      ansible.builtin.assert:
        that:
          - invio_stat.results[0].stat.pw_name == 'root'
          - invio_stat.results[0].stat.gr_name == 'invio'
          - invio_stat.results[0].stat.mode == '0640'
          - invio_stat.results[1].stat.pw_name == 'root'
          - invio_stat.results[1].stat.gr_name == 'invio'
          - invio_stat.results[1].stat.mode == '0750'
        quiet: true

    - name: Check that an unprivileged user cannot read the env file
      ansible.builtin.command:
        argv: [sudo, -u, nobody, cat, /etc/invio/invio.env]
      register: invio_nobody
      changed_when: false
      failed_when: invio_nobody.rc == 0
      no_log: true

    - name: Read the database character set
      ansible.builtin.command:
        argv:
          - mysql
          - -N
          - -e
          - "SELECT DEFAULT_CHARACTER_SET_NAME FROM information_schema.SCHEMATA WHERE SCHEMA_NAME='invio'"
      register: invio_charset
      changed_when: false
      failed_when: invio_charset.stdout != 'utf8mb4'

    - name: Read the grants of the database user
      ansible.builtin.command:
        argv: [mysql, -N, -e, "SHOW GRANTS FOR 'invio'@'localhost'"]
      register: invio_grants
      changed_when: false
      no_log: true

    - name: Check that the grants only cover the invio schema
      ansible.builtin.assert:
        that:
          - invio_grants.stdout_lines | length > 0
          - invio_grants.stdout_lines | reject('match', '^GRANT (USAGE ON \*\.\*|ALL PRIVILEGES ON `invio`\.\*) TO `invio`@`localhost`') | list | length == 0
          - invio_grants.stdout_lines | select('match', '^GRANT ALL PRIVILEGES ON `invio`\.\* ') | list | length == 1
        quiet: true

    - name: Find the newest migration file
      ansible.builtin.shell: |
        set -o pipefail
        newest="$(ls /opt/invio/src/invio/db/migrations/versions/[0-9]*.py | sort | tail -n 1)"
        sed -n -E 's/^revision(: str)? = "([^"]+)".*/\2/p' "$newest"
      args:
        executable: /bin/bash
      register: invio_head
      changed_when: false
      failed_when: invio_head.stdout | length == 0

    - name: Run the migration twice as the service account
      ansible.builtin.command:
        argv: "{{ invio_verify_systemd_run + ['/opt/invio/.venv/bin/invio', 'db', 'upgrade'] }}"
      loop: [1, 2]
      register: invio_upgrade
      changed_when: false

    - name: Check that the schema is at head and that the second call is a no-op
      ansible.builtin.assert:
        that:
          - "('database at revision ' ~ invio_head.stdout) in invio_upgrade.results[0].stdout_lines"
          - invio_upgrade.results[0].stdout_lines == invio_upgrade.results[1].stdout_lines
        quiet: true

    - name: Check whether invio run-due exists
      ansible.builtin.command:
        argv: [/opt/invio/.venv/bin/invio, run-due, --help]
        chdir: /
      register: invio_run_due_help
      changed_when: false
      failed_when: false

    # TODO(#23): remove this guard once `invio run-due` is merged and make the start mandatory.
    - name: Report the skipped run-due start
      ansible.builtin.debug:
        msg: "skipped: requires #23"
      when: invio_run_due_help.rc != 0

    - name: Start the real run-due service (only when issue 23 provides the command)
      ansible.builtin.include_tasks: tasks/start-service.yml
      vars:
        invio_service: invio-run-due.service
      when: invio_run_due_help.rc == 0

    # The journal contract is checked on the real unit and its sandbox. While `run-due` does not
    # exist, a drop-in swaps ExecStart for `invio db upgrade`, which logs JSON lines too.
    - name: Check the journal of the run-due service
      block:
        - name: Remember the start time
          ansible.builtin.command:
            argv: [date, +%s]
          register: invio_probe_start
          changed_when: false

        - name: Swap ExecStart for a command that exists today
          ansible.builtin.include_tasks: tasks/runtime-dropin.yml
          vars:
            invio_dropin_name: 90-journal-probe.conf
            invio_dropin_content: |
              [Service]
              ExecStart=
              ExecStart=/opt/invio/.venv/bin/invio db upgrade
          when: invio_run_due_help.rc != 0

        - name: Start the run-due service for the journal check
          ansible.builtin.include_tasks: tasks/start-service.yml
          vars:
            invio_service: invio-run-due.service

        - name: Copy the journal checker
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../../scripts/check-journal-json.py"
            dest: /usr/local/bin/check-journal-json.py
            mode: "0755"

        - name: Check the journal lines and that no secret leaked
          ansible.builtin.shell: |
            set -o pipefail
            journalctl --sync
            journalctl -u invio-run-due -o cat --since "@{{ invio_probe_start.stdout }}" \
              | /usr/local/bin/check-journal-json.py --require-secrets
          args:
            executable: /bin/bash
          environment:
            INVIO_CHECK_SECRETS: "{{ invio_verify_secrets }}"
          register: invio_journal_check
          changed_when: false
          failed_when: false
          no_log: true

        # The checker prints line numbers and fixed reasons only, so its stderr is safe to show.
        - name: Report the result of the run-due journal check
          ansible.builtin.assert:
            that: invio_journal_check.rc == 0
            fail_msg: "check-journal-json.py failed: {{ invio_journal_check.stderr }}"
            quiet: true
      always:
        - name: Remove the journal probe drop-in
          ansible.builtin.include_tasks: tasks/runtime-dropin.yml
          vars:
            invio_dropin_name: 90-journal-probe.conf

    # The notify-retry command exists today, so this start is a hard gate (no guard).
    - name: Check the notify-retry service
      block:
        - name: Remember the start time of the notify-retry check
          ansible.builtin.command:
            argv: [date, +%s]
          register: invio_notify_start
          changed_when: false

        - name: Start the notify-retry service
          ansible.builtin.include_tasks: tasks/start-service.yml
          vars:
            invio_service: invio-notify-retry.service

        - name: Read the notify-retry journal
          ansible.builtin.shell: |
            journalctl --sync
            journalctl -u invio-notify-retry -o cat --since "@{{ invio_notify_start.stdout }}"
          args:
            executable: /bin/bash
          register: invio_notify_journal
          changed_when: false
          no_log: true

        - name: Check that the retry reported nothing to do
          ansible.builtin.assert:
            that:
              - "'nothing to retry' in invio_notify_journal.stdout_lines"
            quiet: true
          no_log: true

        - name: Check the notify-retry journal contract and that no secret leaked
          ansible.builtin.command:
            argv: [/usr/local/bin/check-journal-json.py, --allow-no-json, --require-secrets]
            stdin: "{{ invio_notify_journal.stdout }}"
          environment:
            INVIO_CHECK_SECRETS: "{{ invio_verify_secrets }}"
          register: invio_notify_check
          changed_when: false
          failed_when: false
          no_log: true

        - name: Report the result of the notify-retry journal check
          ansible.builtin.assert:
            that: invio_notify_check.rc == 0
            fail_msg: "check-journal-json.py failed: {{ invio_notify_check.stderr }}"
            quiet: true

    - name: Read the next elapse of the notify-retry timer
      ansible.builtin.command:
        argv: [systemctl, show, invio-notify-retry.timer, -p, NextElapseUSecRealtime, --value]
      register: invio_notify_next
      changed_when: false

    - name: Convert it to epoch seconds and read the current time
      ansible.builtin.command:
        argv: [date, -d, "{{ invio_notify_next.stdout }}", +%s]
      register: invio_notify_next_epoch
      changed_when: false

    - name: Read the current time
      ansible.builtin.command:
        argv: [date, +%s]
      register: invio_now_epoch
      changed_when: false

    - name: Check that the next notify-retry run is at most 65 minutes ahead (hourly + 5 min)
      ansible.builtin.assert:
        that:
          - (invio_notify_next_epoch.stdout | int) - (invio_now_epoch.stdout | int) > 0
          - (invio_notify_next_epoch.stdout | int) - (invio_now_epoch.stdout | int) <= 3900
        quiet: true

    - name: Read the next elapse of the run-due timer
      ansible.builtin.command:
        argv: [systemctl, show, invio-run-due.timer, -p, NextElapseUSecRealtime, --value]
      register: invio_next
      changed_when: false

    - name: Convert it to minute and second
      ansible.builtin.command:
        argv: [date, -d, "{{ invio_next.stdout }}", +%M:%S]
      register: invio_next_clock
      changed_when: false

    - name: Check that the next start is at most 60 s after a quarter hour
      vars:
        invio_minute: "{{ invio_next_clock.stdout.split(':')[0] | int }}"
        invio_second: "{{ invio_next_clock.stdout.split(':')[1] | int }}"
      ansible.builtin.assert:
        that:
          - (invio_minute | int % 15) * 60 + (invio_second | int) <= 60
        fail_msg: "next elapse {{ invio_next.stdout }} is not within 60 s after a quarter hour"
        quiet: true

    # --- Limits and sandbox (FR-006, FR-008, SC-008, quickstart #21, #22) ----------------------
    - name: Read the effective limits of both services
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - -p
          - MemoryMax,TimeoutStartUSec,NoNewPrivileges,ProtectSystem,ProtectHome,PrivateTmp
          - "{{ item.unit }}"
      loop:
        - {unit: invio-run-due.service, memory: "1073741824", timeout: 3h}
        - {unit: invio-notify-retry.service, memory: "268435456", timeout: 15min}
      loop_control:
        label: "{{ item.unit }}"
      register: invio_limits
      changed_when: false

    - name: Check the limits against the contract
      ansible.builtin.assert:
        that:
          - ('MemoryMax=' ~ item.item.memory) in item.stdout_lines
          - ('TimeoutStartUSec=' ~ item.item.timeout) in item.stdout_lines
          - "'NoNewPrivileges=yes' in item.stdout_lines"
          - "'ProtectSystem=strict' in item.stdout_lines"
          - "'ProtectHome=yes' in item.stdout_lines"
          - "'PrivateTmp=yes' in item.stdout_lines"
        quiet: true
      loop: "{{ invio_limits.results }}"
      loop_control:
        label: "{{ item.item.unit }}"

    # The sandbox properties come from the unit file itself (the `# Sandbox` block plus the
    # writable paths), not from `systemctl show`, so the probes use what the repository ships.
    - name: Read the installed run-due unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/invio-run-due.service
      register: invio_unit_file

    - name: Build the sandbox properties for the probes
      ansible.builtin.set_fact:
        invio_sandbox_props: >-
          {{ (invio_unit_file.content | b64decode).splitlines()
          | select('match', '^(ReadWritePaths|StateDirectory)=') | list
          + (invio_unit_file.content | b64decode).split('# Sandbox')[1].splitlines()
          | select('match', '^[A-Za-z]+=') | list }}

    - name: Turn the properties into systemd-run arguments
      ansible.builtin.set_fact:
        invio_sandbox_args: >-
          {% set out = [] %}{% for prop in invio_sandbox_props %}{% set _ = out.extend(['-p', prop]) %}{% endfor %}{{ out }}

    # Each probe target is writable or readable for invio by its permissions alone, so only the
    # sandbox can deny it: directories owned by invio under /etc, /opt and /srv (ProtectSystem),
    # a world-readable file under /home (ProtectHome) and a passwordless sudo rule for invio
    # (NoNewPrivileges).
    - name: Run the sandbox probes
      block:
        - name: Create the paths that the sandbox must keep read-only or hidden
          ansible.builtin.shell: |
            set -e
            for dir in /etc/invio-probe /opt/invio-probe /srv/invio-probe; do
              install -d -o invio -g invio -m 0755 "$dir"
            done
            install -d -m 0755 /home/probe
            printf 'secret\n' > /home/probe/secret
            chmod 0644 /home/probe/secret
            printf 'invio ALL=(root) NOPASSWD: /bin/true\n' > /etc/sudoers.d/invio-probe
            chmod 0440 /etc/sudoers.d/invio-probe
          args:
            executable: /bin/bash
          changed_when: true

        - name: Run the sandbox probes as the service account with the unit's properties
          ansible.builtin.command:
            argv: >-
              {{ ['systemd-run', '--wait', '--pipe', '--collect', '--uid=invio', '--gid=invio']
              + invio_sandbox_args
              + ['/bin/sh', '-c', item.script] }}
          loop:
            - {name: write /etc owned by invio, script: "touch /etc/invio-probe/x 2>/dev/null && echo WRITTEN || echo DENIED", want: DENIED}
            - {name: write /opt owned by invio, script: "touch /opt/invio-probe/x 2>/dev/null && echo WRITTEN || echo DENIED", want: DENIED}
            - {name: write /srv owned by invio, script: "touch /srv/invio-probe/x 2>/dev/null && echo WRITTEN || echo DENIED", want: DENIED}
            - {name: read under /home, script: "cat /home/probe/secret 2>/dev/null && echo READ || echo DENIED", want: DENIED}
            - {name: list /home, script: "ls -A /home 2>/dev/null || true", want: ""}
            - {name: write the state directory, script: "touch /var/lib/invio/probe && echo OK", want: OK}
            - {name: sudo with a NOPASSWD rule, script: "sudo -n /bin/true >/dev/null 2>&1 && echo ALLOWED || echo DENIED", want: DENIED}
            - name: resolve localhost
              script: >-
                /opt/invio/.venv/bin/python -c "import socket;
                socket.getaddrinfo('localhost', 80, flags=socket.AI_ADDRCONFIG)" && echo OK
              want: OK
          loop_control:
            label: "{{ item.name }}"
          register: invio_probes
          changed_when: false
          failed_when: invio_probes.rc != 0 or invio_probes.stdout | trim != item.want

        # Without the sandbox the sudo rule works: proves that the sudo probe can fail.
        - name: Check that the sudo rule works outside the sandbox
          ansible.builtin.command:
            argv: [systemd-run, --wait, --pipe, --collect, --uid=invio, --gid=invio, sudo, -n, /bin/true]
          changed_when: false
      always:
        - name: Remove the probe artefacts
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/sudoers.d/invio-probe
            - /var/lib/invio/probe
            - /etc/invio-probe
            - /opt/invio-probe
            - /srv/invio-probe
            - /home/probe
