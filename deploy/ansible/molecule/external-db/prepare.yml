---
- name: Prepare
  hosts: target
  become: true
  tasks:
    # Docker Desktop (macOS) can fail the first read of a file on a read-only bind mount with
    # "Permission denied", which makes the role's checkout from /src flaky. Reading everything
    # once avoids it.
    - name: Warm the read-only source mount
      ansible.builtin.command:
        argv: [find, /src, -type, f, -exec, cat, "{}", +]
      register: invio_warm
      changed_when: false
      failed_when: false
      no_log: true

    - name: Wait for the database server container
      ansible.builtin.wait_for:
        host: dbserver
        port: 3306
        timeout: 120

    # Edge case, quickstart #18: an unreachable server fails in mariadb.yml with the host name,
    # before any unit is installed.
    - name: Run the role against a host that does not exist
      block:
        - name: Include the role
          ansible.builtin.include_role:
            name: invio
          vars:
            invio_db_host: no-such-host
        - name: Remember that the role did not fail
          ansible.builtin.set_fact:
            invio_negative_failed: false
      rescue:
        - name: Remember that the role failed
          ansible.builtin.set_fact:
            invio_negative_failed: true
            invio_negative_msg: "{{ ansible_failed_result | to_json }}"

    - name: Check that no unit was installed
      ansible.builtin.stat:
        path: /etc/systemd/system/invio-run-due.timer
      register: invio_negative_timer

    - name: Assert the negative case
      ansible.builtin.assert:
        that:
          - invio_negative_failed
          - "'no-such-host' in invio_negative_msg"
          - not invio_negative_timer.stat.exists
        quiet: true
