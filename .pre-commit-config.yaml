repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, src/)
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false
      - id: ansible-lint
        name: ansible-lint (deploy/ansible, install collections first)
        entry: bash -c 'cd deploy/ansible && uv run --locked --group deploy ansible-lint'
        language: system
        files: ^deploy/ansible/
        pass_filenames: false
      - id: verify-units
        name: verify systemd units (skipped without systemd-analyze)
        entry: deploy/scripts/verify-units.sh --if-available
        language: system
        files: ^deploy/systemd/
        pass_filenames: false
