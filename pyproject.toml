[project]
name = "invio"
version = "0.1.0"
description = "Invio: CLI-based AI research system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "feedparser>=6.0.14",
    "httpx2>=2.13",
    "mistralai>=3.0,<4",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13",
    "pymysql>=1.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "selectolax>=1.0",
    "sqlalchemy>=2.1",
    "trafilatura>=2.0",
    "typer>=0.27.2",
]

[project.scripts]
invio = "invio.cli.main:app"

[project.optional-dependencies]
render = ["playwright>=1.63"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "jsonschema>=4",
    "mypy>=2.4.0",
    "playwright>=1.63",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".claude", ".specify"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "TID251"]

# Layering, enforced only in ``invio.scheduling`` and ``invio.sources`` (see per-file-ignores):
# the schedule calculation is a leaf and must not depend on services or storage, and source
# fetchers must reach the network through the safe client only.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"invio.services".msg = "invio.scheduling and invio.sources must not import invio.services"
"invio.db".msg = "invio.scheduling and invio.sources must not import invio.db"
"httpx2".msg = "source fetchers must use invio.sources.http.SafeHttpClient (FR-001)"
"urllib.request".msg = "source fetchers must use invio.sources.http.SafeHttpClient (FR-001)"

[tool.ruff.lint.per-file-ignores]
"!src/invio/{scheduling,sources}/**" = ["TID251"]
# The modules that implement the safe client are the only ones allowed to use httpx2.
"src/invio/sources/{http,netguard,robots}.py" = ["TID251"]
# The ``job_cli`` fixture is imported into the CLI test modules and used as a parameter.
"tests/test_cli_job*.py" = ["F811"]
# Fixtures from ``tests/http_helpers.py`` are imported and used as parameters.
"tests/test_http*.py" = ["F811"]
"tests/test_source_rss.py" = ["F811"]
"tests/test_source_web*.py" = ["F811"]
"tests/test_http_admission.py" = ["F811"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src"]
plugins = ["pydantic.mypy"]

# feedparser ships no type information; its results are confined to invio.sources.rss._parse.
[[tool.mypy.overrides]]
module = ["feedparser", "feedparser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "live: real calls to external LLM providers (skipped unless -m names live, e.g. -m live)",
    "browser: real headless-Chromium tests (skipped when Chromium cannot be launched)",
    "db: persistence tests that run on SQLite and, with INVIO_TEST_DATABASE_URL, on MariaDB",
]

[tool.coverage.run]
source_dirs = ["src/invio"]
omit = ["*/pytest-of-*/*"]  # temporary provider modules created by tests
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = ['if __name__ == "__main__":', "if TYPE_CHECKING:"]
