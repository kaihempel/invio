[project]
name = "invio"
version = "0.1.0"
description = "Invio: CLI-based AI research system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13",
    "pymysql>=1.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "sqlalchemy>=2.1",
    "typer>=0.27.2",
]

[project.scripts]
invio = "invio.cli.main:app"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "jsonschema>=4",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".claude", ".specify"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "TID251"]

# Layering: the schedule calculation is a leaf and must not depend on services or storage.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"invio.services".msg = "invio.scheduling must not import invio.services"
"invio.db".msg = "invio.scheduling must not import invio.db"

[tool.ruff.lint.per-file-ignores]
"!src/invio/scheduling/**" = ["TID251"]
# The ``job_cli`` fixture is imported into the CLI test modules and used as a parameter.
"tests/test_cli_job*.py" = ["F811"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "db: persistence tests that run on SQLite and, with INVIO_TEST_DATABASE_URL, on MariaDB",
]

[tool.coverage.run]
source_dirs = ["src/invio"]
omit = ["*/pytest-of-*/*"]  # temporary provider modules created by tests
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = ['if __name__ == "__main__":', "if TYPE_CHECKING:"]
