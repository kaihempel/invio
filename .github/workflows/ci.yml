---
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Chromium (browser tests)
        run: uv run playwright install --with-deps chromium

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Format check (ruff)
        run: uv run ruff format --check

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Tests (pytest)
        run: uv run pytest --cov

  deploy-static:
    # Static checks for deploy/: unit verification, YAML and Ansible lint and the unit contract tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (with the deploy group)
        run: uv sync --locked --group deploy

      - name: Verify systemd units
        run: deploy/scripts/verify-units.sh

      - name: Install Ansible collections
        run: >-
          uv run --locked --group deploy ansible-galaxy collection install
          -r deploy/ansible/requirements.yml
          -r deploy/ansible/molecule/requirements.yml
          -p deploy/ansible/.collections

      - name: Lint all YAML files (yamllint, config in .yamllint)
        run: uv run --locked --group deploy yamllint --strict .

      - name: Lint the Ansible role
        working-directory: deploy/ansible
        run: uv run --locked --group deploy ansible-lint

      - name: Unit contract tests
        env:
          # fail instead of skip when ansible-playbook or systemd-analyze is missing
          INVIO_REQUIRE_DEPLOY_TOOLS: "1"
        run: uv run --locked --group deploy pytest -rs tests/test_deploy_*.py

  mariadb:
    # Optional: runs the persistence tests against a real MariaDB (non-blocking).
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MARIADB_DATABASE: invio_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INVIO_TEST_DATABASE_URL: mysql+pymysql://root@127.0.0.1:3306/invio_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Persistence tests on MariaDB
        run: uv run pytest -m db
